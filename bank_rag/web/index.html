<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Voice Line — Test Client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --surface: #161d2e;
    --surface-raised: #1e2740;
    --border: #2a3550;
    --accent: #e8935a;
    --accent-dim: #a86a3e;
    --live: #c94f4f;
    --text: #eef1f6;
    --text-muted: #94a0b8;
    --text-faint: #5c6785;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,147,90,0.10), transparent);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .khachkar-rule {
    height: 6px;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--accent) 0, var(--accent) 2px,
      transparent 2px, transparent 10px
    );
    opacity: 0.55;
  }

  .card-inner { padding: 36px 32px 28px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 27px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0 0 32px;
    max-width: 34ch;
  }

  .subtitle b { color: var(--text); font-weight: 500; }

  /* --- Hero: the connect button --- */

  .dial {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }

  .dial-btn {
    position: relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .dial-btn:hover { transform: scale(1.03); }
  .dial-btn:active { transform: scale(0.98); }

  .dial-btn svg { width: 34px; height: 34px; }
  .dial-btn.connected { background: var(--live); }

  .dial-btn .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    opacity: 0;
  }
  .dial-btn.listening .ring {
    animation: pulse-ring 1.8s ease-out infinite;
  }
  @keyframes pulse-ring {
    0%   { transform: scale(0.92); opacity: 0.65; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .status-line {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint);
  }
  .status-dot.live { background: var(--live); }
  .status-dot.ready { background: var(--accent); }

  /* --- Conversation transcript --- */

  .transcript-panel {
    border-top: 1px solid var(--border);
    background: #0b0f19;
    margin: 0 -32px -28px;
    padding: 16px 32px 24px;
    max-height: 420px;
    overflow-y: auto;
  }
  .transcript-panel .panel-label {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 10px;
  }
  .transcript-empty {
    font-size: 13px;
    color: var(--text-faint);
    font-style: italic;
  }
  .transcript-line {
    margin-bottom: 14px;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .transcript-line .speaker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .transcript-line.you .speaker { color: var(--accent); }
  .transcript-line.agent .speaker { color: #6fa3d1; }
  .transcript-line .text { color: var(--text); }
  .transcript-line.interim .text { color: var(--text-muted); font-style: italic; }

  /* --- Log / activity panel --- */

  .log-panel {
    display: none;
    border-top: 1px solid var(--border);
    background: #0b0f19;
    margin: 0 -32px -28px;
    padding: 14px 32px 20px;
    max-height: 120px;
    overflow-y: auto;
  }
  .log-panel .panel-label {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .log-line {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
  .log-line .t { color: var(--text-faint); }

  audio { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .dial-btn.listening .ring { animation: none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="khachkar-rule"></div>
    <div class="card-inner">

      <h1>Bank Voice Line</h1>
      <p class="subtitle">
        Ask about <b>loans</b>, <b>deposits</b>, or <b>branch locations</b>
        out loud.
      </p>

      <div class="dial">
        <button id="dialBtn" class="dial-btn" aria-label="Connect and enable microphone" disabled>
          <span class="ring"></span>
          <svg id="dialIcon" viewBox="0 0 24 24" fill="none" stroke="#0f1420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
        </button>
        <div class="status-line">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Fetching access token…</span>
        </div>
      </div>

    </div>
    <div class="transcript-panel">
      <div class="panel-label">Conversation</div>
      <div id="transcriptLines">
        <div class="transcript-empty">What you say and the agent's answers will appear here.</div>
      </div>
    </div>
    <div class="log-panel">
      <div class="panel-label">Activity</div>
      <div id="logLines">
        <div class="log-line">Waiting for token…</div>
      </div>
    </div>
  </div>

  <audio id="agentAudio" autoplay></audio>

  <script>
    const { Room, RoomEvent, Track } = LivekitClient;
    let room = null;
    let connected = false;
    let sessionInfo = null; // { url, token, room, identity } — fetched from /token

    const dialBtn = document.getElementById('dialBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const logContainer = document.getElementById('logLines');
    const transcriptContainer = document.getElementById('transcriptLines');

    let logPlaceholderCleared = false;
    let transcriptPlaceholderCleared = false;
    const transcriptSegments = new Map(); // segment id -> its DOM line element

    function log(msg) {
      if (!logPlaceholderCleared) {
        logContainer.innerHTML = '';
        logPlaceholderCleared = true;
      }
      const time = new Date().toLocaleTimeString([], { hour12: false });
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="t">${time}</span>  ${msg}`;
      logContainer.appendChild(line);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Renders one live-updating transcript line per (speaker, segment id):
    // interim (partial, still-being-recognized) text is shown faded, and
    // the same DOM element is updated in place as the segment finalizes,
    // rather than appending duplicate lines.
    function updateTranscriptLine(segmentId, speakerLabel, speakerClass, text, isFinal) {
      if (!transcriptPlaceholderCleared) {
        transcriptContainer.innerHTML = '';
        transcriptPlaceholderCleared = true;
      }

      let el = transcriptSegments.get(segmentId);
      if (!el) {
        el = document.createElement('div');
        el.className = 'transcript-line ' + speakerClass;
        el.innerHTML = `<div class="speaker">${speakerLabel}</div><div class="text"></div>`;
        transcriptContainer.appendChild(el);
        transcriptSegments.set(segmentId, el);
      }

      el.classList.toggle('interim', !isFinal);
      el.querySelector('.text').textContent = text;
      transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
    }

    function setStatus(text, dotClass) {
      statusText.textContent = text;
      statusDot.className = 'status-dot' + (dotClass ? ' ' + dotClass : '');
    }

    // Fetch a fresh access token from token_server.py on page load — used
    // to connect, never shown in the UI.
    async function fetchToken() {
      try {
        const resp = await fetch('/token');
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        sessionInfo = data;
        setStatus('Ready to connect', 'ready');
        dialBtn.disabled = false;
        log(`Token issued for room "${data.room}"`);
      } catch (err) {
        setStatus('Could not get a token');
        log('Token fetch failed: ' + err.message +
            ' — is token_server.py running, and is .env filled in?');
      }
    }

    async function connect() {
      if (!sessionInfo) {
        log('No token yet — retrying token fetch.');
        await fetchToken();
        if (!sessionInfo) return;
      }

      dialBtn.disabled = true;
      setStatus('Connecting…');
      log('Connecting…');

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === Track.Kind.Audio) {
          track.attach(document.getElementById('agentAudio'));
          log('Agent audio track attached');
        }
      });
      room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
        dialBtn.classList.toggle('listening', speakers.length > 0);
      });

      // Live transcription: LiveKit's agent framework publishes both the
      // caller's recognized speech and the agent's spoken replies as
      // transcription segments. Each segment streams in (interim, not
      // yet final) and gets finalized once recognition/generation settles.
      room.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
        const isLocal = participant && participant.isLocal;
        const speakerLabel = isLocal ? 'You' : 'Assistant';
        const speakerClass = isLocal ? 'you' : 'agent';
        for (const seg of segments) {
          updateTranscriptLine(seg.id, speakerLabel, speakerClass, seg.text, seg.final);
        }
      });

      room.on(RoomEvent.Disconnected, () => {
        connected = false;
        dialBtn.classList.remove('connected', 'listening');
        dialBtn.disabled = false;
        setStatus('Ready to connect', 'ready');
        log('Disconnected.');
      });

      try {
        await room.connect(sessionInfo.url, sessionInfo.token);
        log('Joined room.');
        await room.localParticipant.setMicrophoneEnabled(true);
        log('Microphone enabled — go ahead and ask a question.');

        connected = true;
        dialBtn.classList.add('connected', 'listening');
        dialBtn.disabled = false;
        setStatus('Connected — listening', 'live');
      } catch (err) {
        log('Connection failed: ' + err.message);
        setStatus('Connection failed');
        dialBtn.disabled = false;
      }
    }

    async function disconnect() {
      if (room) await room.disconnect();
      // Tokens are single-use in spirit here — grab a fresh one for next time.
      fetchToken();
    }

    dialBtn.addEventListener('click', () => {
      connected ? disconnect() : connect();
    });

    fetchToken();
  </script>
</body>
</html>
